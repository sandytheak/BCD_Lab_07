<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання 4 - Генератор промісів</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/izitoast/dist/css/iziToast.min.css">
    
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .form { display: flex; flex-direction: column; gap: 15px; max-width: 300px; }
        label { display: flex; flex-direction: column; gap: 5px; font-weight: bold; }
        input[type="number"] { padding: 8px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        fieldset { border: 1px solid #ccc; border-radius: 4px; padding: 10px; }
        fieldset label { flex-direction: row; font-weight: normal; align-items: center; cursor: pointer; }
        button { padding: 10px; font-size: 16px; cursor: pointer; background-color: #2196F3; color: white; border: none; border-radius: 4px; transition: background 0.3s; }
        button:hover { background-color: #1976D2; }
    </style>
</head>
<body>
    <form class="form">
        <label>
            Delay (ms)
            <input type="number" name="delay" required min="0"/>
        </label>

        <fieldset>
            <legend>State</legend>
            <label>
                <input type="radio" name="state" value="fulfilled" required />
                Fulfilled
            </label>
            <label>
                <input type="radio" name="state" value="rejected" required />
                Rejected
            </label>
        </fieldset>

        <button type="submit">Create notification</button>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/izitoast/dist/js/iziToast.min.js"></script>
    
    <script src="./js/2-snackbar.js"></script>
</body>
</html>
